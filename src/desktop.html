<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bundlr</title>
  <script id="theme-init" nonce="@@TOKEN@@">
    {
      const root = document.documentElement;
      try {
        if (localStorage.getItem("bundlr-theme") === "light") root.dataset.theme = "light";
      } catch {}
      document.addEventListener("DOMContentLoaded", () => {
        const theme = document.querySelector("#theme");
        theme.setAttribute("aria-pressed", String(root.dataset.theme === "dark"));
        theme.addEventListener("click", () => {
          const dark = root.dataset.theme !== "dark";
          root.dataset.theme = dark ? "dark" : "light";
          theme.setAttribute("aria-pressed", String(dark));
          try { localStorage.setItem("bundlr-theme", root.dataset.theme); } catch {}
        });
      });
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      font: 15px/1.5 system-ui, sans-serif;
      --page: #0f172a;
      --text: #f1f5f9;
      --muted: #cbd5e1;
      --field: #1e293b;
      --border: #94a3b8;
      --button: #1e293b;
      --button-hover: #334155;
      --primary: #93c5fd;
      --primary-hover: #bfdbfe;
      --primary-text: #0f172a;
      --danger: #fca5a5;
      --danger-hover: #fecaca;
      --danger-text: #450a0a;
      --disabled: #334155;
      --focus: #facc15;
      --log: #020617;
      --stderr: #fca5a5;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --field: #ffffff;
      --border: #64748b;
      --button: #e2e8f0;
      --button-hover: #cbd5e1;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-text: #ffffff;
      --danger: #b91c1c;
      --danger-hover: #991b1b;
      --danger-text: #ffffff;
      --disabled: #e2e8f0;
      --focus: #1d4ed8;
      --log: #ffffff;
      --stderr: #b91c1c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); }
    main { max-width: 720px; margin: auto; padding: clamp(16px, 4vw, 28px); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 28px; }
    .subtitle { margin: 4px 0 24px; color: var(--muted); }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input, select, button { font: inherit; }
    input, select {
      width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--field); color: var(--text);
    }
    input::placeholder { color: var(--muted); opacity: 1; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    fieldset { min-width: 0; margin: 14px 0 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; }
    legend { font-weight: 600; }
    .targets { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .targets label { display: flex; min-height: 32px; gap: 8px; align-items: center; margin: 0; font-weight: 400; }
    .targets input { width: 20px; height: 20px; min-height: 20px; flex-shrink: 0; padding: 0; accent-color: var(--primary); }
    .actions { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
    details { margin-top: 14px; }
    summary { cursor: pointer; font-weight: 600; }
    button {
      min-height: 44px; padding: 9px 18px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--button); color: var(--text); cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--button-hover); }
    #theme { display: inline-flex; align-items: center; gap: 8px; }
    #theme::before { content: ""; width: 10px; height: 10px; border: 1px solid currentColor; border-radius: 50%; }
    #theme[aria-pressed="true"]::before { background: currentColor; }
    #package { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
    #package:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
    #cancel { background: var(--danger); color: var(--danger-text); border-color: var(--danger); }
    #cancel:hover:not(:disabled) { background: var(--danger-hover); border-color: var(--danger-hover); }
    button:disabled, #package:disabled, #cancel:disabled, input:disabled, select:disabled {
      background: var(--disabled); color: var(--muted); border-color: var(--border); opacity: 1; cursor: not-allowed;
    }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    #status { min-height: 24px; margin-top: 16px; }
    pre {
      min-height: 160px; max-height: 240px; overflow: auto; margin: 8px 0 0; padding: 12px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--log); color: var(--text);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .stderr { color: var(--stderr); }
    @media (max-width: 560px) {
      .row, .targets { grid-template-columns: minmax(0, 1fr); }
      .row { gap: 0; }
    }
    @media (forced-colors: active) {
      :focus-visible { outline-color: Highlight; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Bundlr</h1>
      <button id="theme" type="button" aria-pressed="true">Dark mode</button>
    </header>
    <p class="subtitle">Package a Python application for @@TARGET@@. Version @@VERSION@@</p>
    <form id="form">
      <label for="source">PyPI requirement or HTTPS Git URL</label>
      <input id="source" required placeholder="example-app==1.0.0">
      <div class="row">
        <div>
          <label for="applicationName">Application name</label>
          <input id="applicationName" placeholder="Auto-detect">
        </div>
        <div>
          <label for="command">Application entry point</label>
          <input id="command" placeholder="Auto-detect">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="applicationKind">Application kind</label>
          <select id="applicationKind">
            <option value="auto">Auto-detect</option>
            <option value="windowed">Windowed</option>
            <option value="console">Console</option>
          </select>
        </div>
        <div>
          <label for="python">Python version</label>
          <input id="python" value="3.12">
        </div>
      </div>
      <label for="outputDirectory">Output directory</label>
      <input id="outputDirectory" value="dist">
      <fieldset>
        <legend>Target platforms</legend>
        <div class="targets">
          <label><input type="checkbox" name="target" value="linux-x86_64" @@linux-x86_64@@>Linux x64</label>
          <label><input type="checkbox" name="target" value="windows-x86_64" @@windows-x86_64@@>Windows x64</label>
          <label><input type="checkbox" name="target" value="macos-arm64" @@macos-arm64@@>macOS Apple Silicon</label>
          <label><input type="checkbox" name="target" value="macos-x86_64" @@macos-x86_64@@>macOS Intel</label>
        </div>
      </fieldset>
      <div class="actions">
        <button id="package" type="submit">Package</button>
        <button id="cancel" type="button" disabled>Cancel</button>
      </div>
      <button id="quit" type="button">Quit Bundlr</button>
    </form>
    <div id="status" role="status"></div>
    <pre id="output" tabindex="0" aria-label="Packaging output"></pre>
  </main>
  <script nonce="@@TOKEN@@">
    const form = document.querySelector("#form");
    const packageButton = document.querySelector("#package");
    const cancel = document.querySelector("#cancel");
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");

    const token = "@@TOKEN@@";
    const post = (route, value) => fetch(route, {
      method: "POST",
      headers: {"x-bundlr-token": token, "content-type": "application/json"},
      body: value === undefined ? undefined : JSON.stringify(value),
    });
    const receiveOutput = (stream, text) => {
      const span = document.createElement("span");
      if (stream === "stderr") span.className = "stderr";
      span.textContent = text;
      output.append(span);
      output.scrollTop = output.scrollHeight;
    };

    let stopped = false;
    let cancelRequested = false;
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      cancelRequested = false;
      output.textContent = "";
      status.textContent = "Packaging application…";
      packageButton.disabled = true;
      cancel.disabled = false;
      try {
        const response = await post("/package", {
          source: document.querySelector("#source").value,
          applicationName: document.querySelector("#applicationName").value,
          command: document.querySelector("#command").value,
          applicationKind: document.querySelector("#applicationKind").value,
          python: document.querySelector("#python").value,
          outputDirectory: document.querySelector("#outputDirectory").value,
          targets: [...document.querySelectorAll('input[name="target"]:checked')]
            .map((input) => input.value),
        });
        if (!response.ok) throw new Error(await response.text());
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let pending = "";
        let completed = false;
        try {
          for (;;) {
            const {done, value} = await reader.read();
            pending += decoder.decode(value, {stream: !done});
            let separator;
            while ((separator = pending.indexOf("\n")) !== -1) {
              const event = JSON.parse(pending.slice(0, separator));
              pending = pending.slice(separator + 1);
              if (event.type === "output") receiveOutput(event.stream, event.text);
              if (event.type === "error") throw new Error(event.message);
              if (event.type === "done") {
                completed = true;
                if (!stopped) status.textContent = "Created " + event.results.map((result) => result.archivePath).join(", ") + ".";
              }
            }
            if (done) break;
          }
          if (!completed) throw new Error("Bundlr stopped before reporting a result.");
        } finally {
          await reader.cancel().catch(() => {});
          reader.releaseLock();
        }
      } catch (error) {
        if (!stopped) status.textContent = "Error: " + (cancelRequested ? "Cancelled by the user." : (error.message ?? String(error)));
      } finally {
        if (!stopped) packageButton.disabled = false;
        cancel.disabled = true;
      }
    });

    cancel.addEventListener("click", async () => {
      cancelRequested = true;
      status.textContent = "Cancelling…";
      await post("/cancel");
    });
    document.querySelector("#quit").addEventListener("click", async () => {
      try {
        const response = await post("/quit");
        if (!response.ok) throw new Error(await response.text());
        stopped = true;
        form.querySelectorAll("button, input, select").forEach((element) => element.disabled = true);
        status.textContent = "Bundlr stopped.";
      } catch (error) {
        status.textContent = "Could not stop Bundlr: " + (error.message ?? String(error));
      }
    });
  </script>
</body>
</html>
