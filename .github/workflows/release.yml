name: Bun verification and release
on:
  push:
    branches: [main, bun]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bundlr-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --production --frozen-lockfile --ignore-scripts
      - run: bun run prepare:uv
      - run: bun run verify
      - run: bun test src
      - run: bun test --aot src
  linux:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --production --frozen-lockfile --ignore-scripts
      - run: bun scripts/check_toolchain.ts
      - run: bun run prepare:uv
      - name: Stamp tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNDLR_RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/stamp_version.ts
      - run: bun run build
      - run: bun run verify:compiled
      - name: Test Linux builder and recipients
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        run: bun scripts/acceptance.ts dist/bundlr-linux-x86_64
      - name: Test all target packaging for release candidates
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: bun scripts/acceptance.ts dist/bundlr-linux-x86_64 .build/acceptance --all-targets
      - name: Test real browser workflows
        run: bun scripts/browser_smoke.ts dist/bundlr-linux-x86_64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bundlr-linux-x86_64
          path: dist/bundlr-linux-x86_64*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: cross-windows-x86_64
          path: .build/acceptance/applications/*-windows-x86_64.zip*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: cross-macos-arm64
          path: .build/acceptance/applications/*-macos-arm64.tar.gz*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: cross-macos-x86_64
          path: .build/acceptance/applications/*-macos-x86_64.tar.gz*
          if-no-files-found: error
          compression-level: 0
  native:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [verify, linux]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x86_64
            exe: bundlr-windows-x86_64.exe
          - runner: macos-15
            target: macos-arm64
            exe: bundlr-macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64
            exe: bundlr-macos-x86_64
    runs-on: ${{ matrix.runner }}
    name: Verify ${{ matrix.target }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --production --frozen-lockfile --ignore-scripts
      - run: bun scripts/check_toolchain.ts
      - run: bun run prepare:uv
      - name: Stamp tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNDLR_RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/stamp_version.ts
      - run: bun test src/core/process_test.ts
      - run: bun run build
      - run: bun run verify:compiled
      - name: Test native builder and recipients
        run: bun scripts/acceptance.ts dist/${{ matrix.exe }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cross-${{ matrix.target }}
          path: .build/cross
      - name: Run Linux-built recipients on their target host
        run: bun scripts/consume.ts .build/cross
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bundlr-${{ matrix.target }}
          path: dist/${{ matrix.exe }}*
          if-no-files-found: error
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, linux, native]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: bundlr-*
          path: release
          merge-multiple: true
      - name: Verify complete release set
        run: |
          test "$(find release -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          cd release
          sha256sum --check ./*.sha256
      - name: Include licence notices
        run: |
          cp LICENSE release/LICENSE
          cp vendor/jszip/LICENSE.markdown release/JSZip-LICENSE.txt
          cp vendor/uv-LICENSE-MIT.txt release/uv-LICENSE-MIT.txt
          cp vendor/uv-LICENSE-APACHE.txt release/uv-LICENSE-APACHE.txt
      - name: Publish tested executables
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
