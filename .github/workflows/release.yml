name: Cross-platform packaging

on:
  push:
    branches:
      - main
      - rewrite/deno-typescript
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DENO_VERSION: v2.9.4
  MAX_CLIENT_BYTES: "60000000"
  SAMPLE_REQUIREMENT: pycowsay==0.0.0.2

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno task check
      - run: deno task test

  native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            deno_target: x86_64-unknown-linux-gnu
            bundlr_target: linux-x86_64
            name: linux-x86_64
            cli: bundlr-cli-linux-x86_64
            desktop: bundlr-linux-x86_64.AppImage
            distributable: bundlr-linux-x86_64.AppImage
            client_archive: PyCowsay-linux-x86_64.tar.gz
          - runner: windows-2022
            deno_target: x86_64-pc-windows-msvc
            bundlr_target: windows-x86_64
            name: windows-x86_64
            cli: bundlr-cli-windows-x86_64.exe
            desktop: Bundlr-windows-x86_64.exe
            distributable: Bundlr-windows-x86_64.exe
            client_archive: PyCowsay-windows-x86_64.zip
          - runner: macos-15
            deno_target: aarch64-apple-darwin
            bundlr_target: macos-arm64
            name: macos-arm64
            cli: bundlr-cli-macos-arm64
            desktop: Bundlr.app
            distributable: Bundlr-macos-arm64.dmg
            client_archive: PyCowsay-macos-arm64.tar.gz
          - runner: macos-15-intel
            deno_target: x86_64-apple-darwin
            bundlr_target: macos-x86_64
            name: macos-x86_64
            cli: bundlr-cli-macos-x86_64
            desktop: Bundlr.app
            distributable: Bundlr-macos-x86_64.dmg
            client_archive: PyCowsay-macos-x86_64.tar.gz

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Prepare checksum-verified uv
        run: deno task prepare:uv ${{ matrix.deno_target }}

      - name: Compile Bundlr CLI
        run: >-
          deno compile
          --target ${{ matrix.deno_target }}
          --allow-read
          --allow-write
          --allow-run
          --allow-env
          --allow-net
          --include vendor/uv
          --output dist/${{ matrix.cli }}
          src/main.ts

      - name: Diagnose Bundlr CLI on Unix
        if: runner.os != 'Windows'
        run: ./dist/${{ matrix.cli }} --diagnose

      - name: Diagnose Bundlr CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\dist\${{ matrix.cli }}" --diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Bundlr desktop application
        run: >-
          deno desktop
          --target ${{ matrix.deno_target }}
          --allow-read
          --allow-write
          --allow-run
          --allow-env
          --allow-net
          --include vendor/uv
          --output dist/${{ matrix.desktop }}
          src/desktop.ts

      - name: Diagnose Linux desktop application
        if: runner.os == 'Linux'
        run: xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 ./dist/${{ matrix.desktop }} --diagnose

      - name: Diagnose macOS desktop application
        if: runner.os == 'macOS'
        run: ./dist/${{ matrix.desktop }}/Contents/MacOS/Bundlr --diagnose

      - name: Diagnose Windows desktop application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\dist\${{ matrix.desktop }}" --diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: >-
          deno desktop
          --target ${{ matrix.deno_target }}
          --allow-read
          --allow-write
          --allow-run
          --allow-env
          --allow-net
          --include vendor/uv
          --output dist/${{ matrix.distributable }}
          src/desktop.ts

      - name: Package pinned sample application
        run: >-
          deno run
          --allow-read
          --allow-write
          --allow-run
          --allow-env
          --allow-net
          src/main.ts
          --name PyCowsay
          --command pycowsay
          --kind console
          --target ${{ matrix.bundlr_target }}
          --output sample-dist
          ${{ env.SAMPLE_REQUIREMENT }}

      - name: Smoke-test generated application on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          output="$(./sample-dist/PyCowsay/PyCowsay "CI smoke test")"
          echo "$output"
          [[ "$output" == *"CI smoke test"* ]]

      - name: Smoke-test generated application on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & ".\sample-dist\PyCowsay\PyCowsay.exe" "CI smoke test"
          $output
          if (($output -join "`n") -notmatch "CI smoke test") {
            throw "Generated application produced unexpected output."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce unpacked client size budget
        run: >-
          deno run --allow-read
          scripts/check_artifact_size.ts
          sample-dist/PyCowsay
          ${{ env.MAX_CLIENT_BYTES }}

      - name: Archive generated application on Unix
        if: runner.os != 'Windows'
        run: tar -C sample-dist -czf dist/${{ matrix.client_archive }} PyCowsay

      - name: Archive generated application on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path .\sample-dist\PyCowsay
          -DestinationPath .\dist\${{ matrix.client_archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundlr-${{ matrix.name }}
          path: |
            dist/${{ matrix.distributable }}
            dist/${{ matrix.client_archive }}
          if-no-files-found: error
          compression-level: 0
