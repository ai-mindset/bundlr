name: Verify and release Bundlr

on:
  push:
    branches:
      - main
      - rewrite/deno-typescript
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Cancel any in-progress run for the same tag (e.g. on a re-push)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DENO_VERSION: v2.9.4

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno task check
      - run: deno task test

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            deno_target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            cli: bundlr-cli-linux-x86_64
            desktop: bundlr-linux-x86_64.AppImage
          - runner: windows-2022
            deno_target: x86_64-pc-windows-msvc
            name: windows-x86_64
            cli: bundlr-cli-windows-x86_64.exe
            desktop: Bundlr-windows-x86_64.exe
          - runner: macos-15
            deno_target: aarch64-apple-darwin
            name: macos-arm64
            cli: bundlr-cli-macos-arm64
            desktop: Bundlr-macos-arm64.dmg
          - runner: macos-15-intel
            deno_target: x86_64-apple-darwin
            name: macos-x86_64
            cli: bundlr-cli-macos-x86_64
            desktop: Bundlr-macos-x86_64.dmg
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Prepare checksum-verified uv
        run: deno task prepare:uv ${{ matrix.deno_target }}

      - name: Compile Bundlr CLI
        run: >-
          deno compile
          --target ${{ matrix.deno_target }}
          --allow-read
          --allow-write
          --allow-run
          --allow-env
          --allow-net
          --include vendor/uv
          --output dist/${{ matrix.cli }}
          src/main.ts

      - name: Build Bundlr desktop application
        run: >-
          deno desktop
          --target ${{ matrix.deno_target }}
          --allow-read
          --allow-write
          --allow-run
          --allow-env
          --allow-net
          --include vendor/uv
          --output dist/${{ matrix.desktop }}
          src/desktop.ts

      - name: Diagnose CLI on Unix
        if: runner.os != 'Windows'
        run: ./dist/${{ matrix.cli }} --diagnose

      - name: Diagnose CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\dist\${{ matrix.cli }}" --diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: bundlr-${{ matrix.name }}
          path: |
            dist/${{ matrix.cli }}
            dist/${{ matrix.desktop }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundlr-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
