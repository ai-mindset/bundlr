name: Verify and release Bundlr

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Cancel any in-progress run for the same tag (e.g. on a re-push)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.3

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci
      - run: bun run lint:format
      - run: bun run typecheck
      - run: bun test

  build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            uv_target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            name: linux-x86_64
            cli: bundlr-cli-linux-x86_64
          - runner: windows-2022
            uv_target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            name: windows-x86_64
            cli: bundlr-cli-windows-x86_64.exe
          - runner: macos-15
            uv_target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            name: macos-arm64
            cli: bundlr-cli-macos-arm64
          - runner: macos-15-intel
            uv_target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            name: macos-x86_64
            cli: bundlr-cli-macos-x86_64
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun ci

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNDLR_RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/stamp_version.ts

      - name: Prepare checksum-verified uv
        run: bun run prepare:uv ${{ matrix.uv_target }}

      - name: Compile Bundlr CLI
        run: >-
          bun build --compile
          --target=${{ matrix.bun_target }}
          --asset vendor/uv
          src/main.ts
          --outfile dist/${{ matrix.cli }}

      - name: Diagnose CLI on Unix
        if: runner.os != 'Windows'
        run: ./dist/${{ matrix.cli }} --diagnose

      - name: Diagnose CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\dist\${{ matrix.cli }}" --diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: bundlr-${{ matrix.name }}
          path: |
            dist/${{ matrix.cli }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundlr-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
