name: Linux cross-platform application fixture
'on':
  workflow_call:
    inputs:
      target:
        required: true
        type: string
permissions:
  contents: read
env:
  BUNDLR_PYTHON_CACHE_DIRECTORY: ${{ github.workspace }}/.build/python-cache
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Cache checksum-verified Python archives
        uses: actions/cache@v5
        with:
          path: .build/python-cache
          key: python-v1-${{ runner.os }}-${{ inputs.target }}-${{ hashFiles('src/core/distribution.jac', 'src/domain/request.jac') }}
          restore-keys: python-v1-${{ runner.os }}-${{ inputs.target }}-
      - uses: actions/download-artifact@v7
        with:
          name: bundlr-linux-x86_64
          path: linux-release
      - name: Package a Linux-built application for this target
        env:
          BUNDLR_FIXTURE_TARGET: ${{ inputs.target }}
        run: |
          tar -xzf linux-release/bundlr-linux-x86_64.tar.gz
          BLACK_VERSION="$(jq -r .acceptance.blackVersion build-lock.json)"
          ./bundlr-linux-x86_64/bundlr --name Black --command black --target "$BUNDLR_FIXTURE_TARGET" --output .build/applications "black==$BLACK_VERSION"
      - uses: actions/upload-artifact@v6
        with:
          name: application-fixtures-${{ inputs.target }}
          path: |-
            .build/applications/Black-*.tar.gz
            .build/applications/Black-*.zip
            .build/applications/Black-*.sha256
          if-no-files-found: error
          compression-level: 0
