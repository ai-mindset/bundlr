name: Linux cross-platform application fixtures
'on':
  workflow_call: null
permissions:
  contents: read
env:
  BUNDLR_PYTHON_CACHE_DIRECTORY: ${{ github.workspace }}/.build/python-cache
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Cache checksum-verified Python archives
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: .build/python-cache
          key: python-v1-${{ runner.os }}-all-${{ hashFiles('src/core/distribution.jac', 'src/domain/request.jac') }}
          restore-keys: python-v1-${{ runner.os }}-all-
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bundlr-linux-x86_64
          path: linux-release
      - name: Package Linux-built applications for all four targets
        run: |
          tar -xzf linux-release/bundlr-linux-x86_64.tar.gz
          BLACK_VERSION="$(jq -r .acceptance.blackVersion build-lock.json)"
          ./bundlr-linux-x86_64/bundlr --name Black --command black --target all --output .build/applications "black==$BLACK_VERSION"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: application-fixtures-linux-x86_64
          path: |-
            .build/applications/Black-linux-x86_64.tar.gz
            .build/applications/Black-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: application-fixtures-windows-x86_64
          path: |-
            .build/applications/Black-windows-x86_64.zip
            .build/applications/Black-windows-x86_64.zip.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: application-fixtures-macos-arm64
          path: |-
            .build/applications/Black-macos-arm64.tar.gz
            .build/applications/Black-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: application-fixtures-macos-x86_64
          path: |-
            .build/applications/Black-macos-x86_64.tar.gz
            .build/applications/Black-macos-x86_64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
