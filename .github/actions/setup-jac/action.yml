name: Set up pinned Jac
description: Install and verify the released Jac compiler pinned by Bundlr.
inputs:
  version:
    description: Exact Jac release version from build-lock.json.
    required: true
runs:
  using: composite
  steps:
    - name: Restore pinned Jac executable
      id: jac-binary
      uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
      with:
        path: ~/.local/bin/jac
        key: jac-binary-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}
    - name: Install pinned Jac release
      if: steps.jac-binary.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        JAC_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        test "$(jq -r .jacVersion build-lock.json)" = "$JAC_INSTALL_VERSION"
        installer="$(mktemp "$RUNNER_TEMP/install-jac-XXXXXXXX")"
        trap 'rm -f "$installer"' EXIT
        curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh -o "$installer"
        bash "$installer" --version "$JAC_INSTALL_VERSION"
    - name: Verify pinned Jac and add it to PATH
      shell: bash
      env:
        JAC_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        test "$(jq -r .jacVersion build-lock.json)" = "$JAC_INSTALL_VERSION"
        version="$("$HOME/.local/bin/jac" --version)"
        case "$version" in
          "jac $JAC_INSTALL_VERSION "*) ;;
          *) echo "::error::Expected Jac $JAC_INSTALL_VERSION, got $version"; exit 1 ;;
        esac
        echo "$version"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
